    - name: Set up wikispeech-tts-wrappers
      run: |
       git clone https://github.com/stts-se/wikispeech-tts-wrappers
       curl -LsSf https://astral.sh/uv/install.sh | sh
       cd wikispeech-tts-wrappers
       uv venv
      
    - name: Set up textproc
      run: |
       cd wikispeech-tts-wrappers
       source .venv/bin/activate
       uv pip install -r textproc/requirements.txt
       
       cd textproc
       uvicorn textproc_server:app --env-file config_sample.env --port 8011 &

