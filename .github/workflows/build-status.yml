    - name: Set up piper
      run: |
       cd wikispeech-tts-wrappers
       source .venv/bin/activate
       pip install torch --index-url https://download.pytorch.org/whl/cpu
       uv pip install -r piper_server/requirements.txt
       # workaround for pytorch
       ls .venv/lib/python3.*/site-packages
       sed -i 's/checkpoint = torch.load(checkpoint_path, map_location=device)/checkpoint = torch.load(checkpoint_path, map_location=device, weights_only=False)/' .venv/lib/python3.*/site-packages/dp/model/model.py
       
       uvicorn piper_server:app --env-file config_minimal.env --port 8010 &


    - name: Ping servers
